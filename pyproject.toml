[project]
name = "agent-observatory"
version = "0.1.0"
description = "Observability primitives for AI agents (tracing and streaming introspection)"
authors = [{ name = "Darshan Parmar", email = "darshanparmar.dev@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "livekit-agents>=1.3.10",
    "livekit-plugins-cartesia>=1.3.10",
    "livekit-plugins-deepgram>=1.3.10",
    "livekit-plugins-silero>=1.3.10",
    "livekit-plugins-turn-detector>=1.3.10",
    "python-dotenv>=1.2.1",
] # Core has none

[project.optional-dependencies]
otel = [
    "opentelemetry-api >=1.0.0",
    "opentelemetry-sdk >=1.0.0",
    "opentelemetry-exporter-otlp-proto-grpc >=1.0.0",
]
dev = ["pytest", "pytest-asyncio", "black", "ruff", "mypy", "types-setuptools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_observatory"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
